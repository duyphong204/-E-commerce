name: Enterprise CI/CD Pipeline

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  frontend-ci:
    name:  Frontend CI (Type Check & Build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name:  Checkout Repository Code
        uses: actions/checkout@v4

      - name:  Setup Node.js 20 LTS with NPM Cache
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'

      - name:  Install Frontend Dependencies (Clean Install)
        run: npm ci

      - name:  Run Strict TypeScript Type Check
        run: npm run type-check

      - name:  Build Production Bundle (Vite)
        run: npm run build

  backend-ci:
    name: Backend CI (Type Check & Compilation)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20 LTS with NPM Cache
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: './backend/package-lock.json'

      - name: Install Backend Dependencies (Clean Install)
        run: npm ci

      - name: Run Strict TypeScript Type Check
        run: npm run type-check

      - name: Compile Backend Code (TSC)
        run: npm run build
